name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Build shared first
        run: pnpm --filter @reflexa/shared build
      - name: Typecheck (root project refs)
        run: pnpm -w -r run typecheck
      - name: Lint (root)
        run: pnpm -w run lint
      - name: Run tests
        run: pnpm -w -r run test --run
        env:
          SKIP_ENV_VALIDATION: 'true'
          GOOGLE_API_KEY: 'test-stub'
          PHOENIX_API_KEY: 'test-stub'
          PHOENIX_COLLECTOR_ENDPOINT: 'http://localhost:6006/v1/traces'
          SUPABASE_URL: 'http://localhost:54321'
          SUPABASE_SERVICE_ROLE_KEY: 'test-stub'
      - name: Build all packages
        run: pnpm -w -r run build
